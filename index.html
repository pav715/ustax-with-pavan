<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Tax With Pavan</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--p:#1e40af;--s:#0ea5e9;--a:#f59e0b;--d:#0f172a;--l:#f8fafc;--g:#64748b}body{font-family:Segoe UI;color:var(--d);background:var(--l)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p),var(--s))}.box{background:white;padding:2.5rem;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:420px;margin:2rem}.title{font-size:2rem;font-weight:700;color:var(--d)}.sub{color:var(--g);margin:0.5rem 0 2rem}.form-group{margin-bottom:1.5rem}.form-group label{display:block;margin-bottom:0.5rem;font-weight:600}.form-group input{width:100%;padding:0.9rem;border:2px solid #e2e8f0;border-radius:6px}.form-group input:focus{outline:none;border-color:var(--p)}.btn{width:100%;padding:1rem;font-size:1rem;border:none;border-radius:6px;font-weight:600;background:linear-gradient(135deg,var(--p),var(--s));color:white;cursor:pointer}.error{background:#fee2e2;color:#991b1b;padding:0.8rem;border-radius:6px;margin-bottom:1rem;display:none}.toggle{text-align:center;margin-top:1.5rem;color:var(--g)}.toggle a{color:var(--p);cursor:pointer;font-weight:600}.hidden{display:none}.app{display:none}nav{background:white;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}.logo{font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.nav-links{display:flex;gap:2rem;list-style:none}.nav-links a{text-decoration:none;color:var(--d);font-weight:500;cursor:pointer}.user-info{color:var(--g);font-size:0.9rem}.logout{background:var(--a);color:white;padding:0.5rem 1rem;border-radius:4px;border:none;cursor:pointer}.hero{background:linear-gradient(135deg,var(--p),var(--s));color:white;padding:6rem 2rem;text-align:center}.hero h1{font-size:3rem;margin-bottom:1rem}.section{max-width:1200px;margin:0 auto;padding:4rem 2rem}.section-title{font-size:2.5rem;margin-bottom:3rem;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem}.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05)}.card-header{background:linear-gradient(135deg,var(--p),var(--s));color:white;padding:1rem;font-weight:700}.card-body{padding:1.5rem}.topic{font-weight:600;margin-bottom:0.5rem}.check{margin-top:1rem}.check input{margin-right:0.5rem;cursor:pointer}.links{margin:2rem 0;text-align:center}.links a{display:inline-block;background:#0088cc;color:white;padding:0.7rem 1.2rem;border-radius:4px;text-decoration:none;margin:0.5rem;font-weight:600}footer{background:var(--d);color:white;padding:2rem;text-align:center}
</style>
</head>
<body>

<div class="login" id="auth">
<div class="box">
<h2 class="title" id="title">Login</h2>
<p class="sub">Access your 60-day course</p>
<div class="error" id="err"></div>
<form onsubmit="login(event)">
<div class="form-group">
<label>Email</label>
<input type="email" id="email" required placeholder="your@email.com">
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="pass" required placeholder="6+ chars" minlength="6">
</div>
<button type="submit" class="btn" id="btn">Login</button>
</form>
<div class="toggle">
<span id="tog">No account? <a onclick="toggle()">Sign Up</a></span>
</div>
</div>
</div>

<div class="app" id="app">
<nav>
<div class="logo">📊 US Tax With Pavan</div>
<ul class="nav-links">
<li><a onclick="to('h')">Home</a></li>
<li><a onclick="to('c')">Course</a></li>
<li><a onclick="to('t')">Telegram</a></li>
<li class="user-info">👤 <span id="mail"></span></li>
<li><button class="logout" onclick="out()">Logout</button></li>
</ul>
</nav>
<section class="hero" id="h">
<h1>Master US Taxation in 60 Days</h1>
<p id="welcome"></p>
<button class="btn" onclick="to('c')" style="padding:0.8rem 1.8rem;width:auto;background:var(--a)">Start</button>
</section>
<section class="section" id="c">
<h2 class="section-title">60-Day Course 📚</h2>
<div class="grid" id="grid"></div>
</section>
<section class="section" style="background:#f8fafc" id="t">
<h2 class="section-title">Telegram Channels</h2>
<div class="links">
<a href="https://t.me/USTaxJobs">💼 Tax Jobs</a>
<a href="https://t.me/USTax_technology_Jobs">💻 Software Jobs</a>
<a href="https://t.me/Degree_Fresher_Jobs">🎓 Fresher</a>
<a href="https://t.me/B_Tech_Jobs_Fresher_Hyd">🏢 B.Tech</a>
</div>
</section>
<footer><p>&copy; 2026 US Tax With Pavan</p></footer>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyAZD2xVz-Psu2-RDvxxJd0hRUhTwHn__2A",authDomain:"ustax-with-pavan.firebaseapp.com",projectId:"ustax-with-pavan",storageBucket:"ustax-with-pavan.firebasestorage.app",messagingSenderId:"643308357353",appId:"1:643308357353:web:1fa7dec962064968dd9278"});
const auth=firebase.auth(),db=firebase.firestore();
let mode=0,user=null;
const days=[{t:"What is US Taxation?",d:"Basics"},{t:"Income Types",d:"W-2, 1099"},{t:"Form 1040",d:"Return"},{t:"Filing Status",d:"Single/Married"},{t:"Deductions",d:"Standard/Item"},{t:"Schedule A",d:"Mortgage"},{t:"Self-Employ",d:"Schedule C"},{t:"Capital Gains",d:"Short/Long"},{t:"Business",d:"Expenses"},{t:"Home Office",d:"Method"}];

auth.onAuthStateChanged(u=>{if(u){user=u;show_app()}else{show_login()}});

function show_login(){document.getElementById('auth').style.display='flex';document.getElementById('app').style.display='none'}
function show_app(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';document.getElementById('mail').textContent=user.email;document.getElementById('welcome').textContent='Welcome! Track below.';gen();load()}

function toggle(){mode=!mode;const t=document.getElementById('title'),b=document.getElementById('btn'),tog=document.getElementById('tog');if(mode){t.textContent='Sign Up';b.textContent='Create';tog.innerHTML='Have? <a onclick="toggle()">Login</a>'}else{t.textContent='Login';b.textContent='Login';tog.innerHTML='No? <a onclick="toggle()">Sign Up</a>'}}

async function login(e){e.preventDefault();const em=document.getElementById('email').value,pw=document.getElementById('pass').value,b=document.getElementById('btn'),er=document.getElementById('err');b.disabled=true;try{if(mode){const r=await auth.createUserWithEmailAndPassword(em,pw);await db.collection('users').doc(r.user.uid).set({email:em,createdAt:new Date(),progress:{}})}else{await auth.signInWithEmailAndPassword(em,pw)}}catch(e){er.style.display='block';er.textContent=e.message;b.disabled=false}}

function gen(){const c=document.getElementById('grid');c.innerHTML='';for(let i=1;i<=60;i++){const d=days[(i-1)%days.length],card=document.createElement('div');card.className='card';card.innerHTML=`<div class="card-header">Day ${i}</div><div class="card-body"><div class="topic">${d.t}</div><div style="color:var(--g);margin-bottom:1rem">${d.d}</div><div style="background:#f0f0f0;height:150px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:1rem">🎥</div><div class="check"><input type="checkbox" id="d${i}" onchange="save(${i},this.checked)"><label for="d${i}">Done</label></div></div>`;c.appendChild(card)}}

async function save(day,done){if(!user)return;const data={};data['progress.day'+day]=done;await db.collection('users').doc(user.uid).update(data)}

async function load(){if(!user)return;const doc=await db.collection('users').doc(user.uid).get();if(doc.exists&&doc.data().progress){Object.keys(doc.data().progress).forEach(k=>{const n=k.replace('day',''),cb=document.getElementById('d'+n);if(cb)cb.checked=doc.data().progress[k]})}}

function to(id){const m={'h':'h','c':'c','t':'t'};document.getElementById(m[id])?.scrollIntoView({behavior:'smooth'})}
async function out(){await auth.signOut()}
</script>
</body>
</html>
